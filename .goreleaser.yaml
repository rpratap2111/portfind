# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release build: push a tag like v0.1.0 and .github/workflows/release.yml runs
# this. Local dry run: go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean
version: 2

project_name: portfind

before:
  hooks:
    # Windows resources (icon, manifest, version info shown in Task Manager and
    # file Properties), stamped with this release's version. The .syso files
    # are gitignored; `go generate ./cmd/...` makes dev copies with the icon.
    - >-
      go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64,arm64 --manifest cli
      --out cmd/portfind/rsrc --icon assets/portfind.ico
      --product-name portfind --file-description "portfind terminal UI"
      --original-filename portfind.exe --copyright "MIT License"
      --file-version {{ .Major }}.{{ .Minor }}.{{ .Patch }} --product-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}
    - >-
      go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64,arm64 --manifest gui
      --out cmd/portfind-tray/rsrc --icon assets/portfind.ico
      --product-name portfind --file-description "portfind tray"
      --original-filename portfind-tray.exe --copyright "MIT License"
      --file-version {{ .Major }}.{{ .Minor }}.{{ .Patch }} --product-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}

builds:
  # Built separately per OS so each OS gets its own archive layout: Windows
  # zips carry two programs, Linux and macOS archives one.
  - id: portfind-windows
    main: ./cmd/portfind
    binary: portfind
    env:
      - CGO_ENABLED=0 # pure Go (modernc SQLite), so cross-compiling just works
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: portfind-tray
    main: ./cmd/portfind-tray
    binary: portfind-tray
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -H=windowsgui -X main.version={{ .Version }} # GUI subsystem: no console window behind the tray icon

  - id: portfind-linux
    main: ./cmd/portfind
    binary: portfind
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: portfind-darwin
    main: ./cmd/portfind
    binary: portfind
    env:
      - CGO_ENABLED=0 # libproc is bound without cgo, so this cross-compiles from Linux too
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

# No version in the archive names, so these URLs always serve the newest
# release, e.g. .../releases/latest/download/portfind_windows_amd64.zip.
# install.ps1 and install.sh depend on these names.
archives:
  - id: windows
    ids: [portfind-windows, portfind-tray]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

  - id: linux
    ids: [portfind-linux]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

  - id: darwin
    ids: [portfind-darwin]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt # install.ps1 and install.sh verify downloads against this

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  footer: |
    ## Install

    Windows (PowerShell):

    ```powershell
    irm https://raw.githubusercontent.com/rpratap2111/portfind/main/install.ps1 | iex
    ```

    Linux and macOS:

    ```sh
    curl -fsSL https://raw.githubusercontent.com/rpratap2111/portfind/main/install.sh | sh
    ```

    Or download the archive for your OS and CPU below (`amd64` for most machines, `arm64` for ARM, including Apple silicon Macs; macOS archives are named `darwin`).
    On Windows, run `portfind.exe` (terminal UI) or `portfind-tray.exe` (notification-area icon), and keep them in the same folder. The Windows binaries are not code-signed, so SmartScreen may warn on first run: click **More info → Run anyway**.
